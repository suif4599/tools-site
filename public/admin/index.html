<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Tools</title>
<script>
  try {
    const t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="/ui/ak-ui.css">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/site.css">
<link rel="stylesheet" href="admin.css">
<script defer src="/ui/shell.js"></script>
</head>
<body>
<tool-shell title="Admin" data-session-url="api/session" data-logout-url="api/logout"></tool-shell>
<main class="page">
  <header class="hero">
    <p class="kicker">Console</p>
    <h1 class="display">Admin</h1>
    <p class="hint">Manage site accounts.</p>
  </header>

  <form id="create" class="panel admin-panel">
    <h2 class="section-title">Create user</h2>
    <label for="new-username">Username</label>
    <input id="new-username" autocomplete="off" required>
    <label for="new-password">Password</label>
    <input id="new-password" type="password" autocomplete="new-password" required>
    <label for="new-role">Role</label>
    <select id="new-role">
      <option value="user">user</option>
      <option value="admin">admin</option>
    </select>
    <p class="form-actions"><button type="submit" class="primary">Create</button></p>
  </form>

  <h2 class="section-title">Users</h2>
  <table>
    <thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Created</th><th></th></tr></thead>
    <tbody id="users"></tbody>
  </table>
  <p id="msg" class="msg" hidden></p>
</main>
<script defer src="admin.js"></script>
</body>
</html>
